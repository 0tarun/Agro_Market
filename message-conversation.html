<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Conversation - AgroMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="message-conversation.css" />
</head>

<body>
    <main class="conversation-page">
        <a href="farmer-feedback.html" class="back-link" aria-label="Back to feedback">&larr;</a>

        <section class="profile-area">
            <img src="/figma/images.jpg" alt="Supti" class="big-avatar" />
            <div>
                <h1>Supti</h1>
                <p>New Visayas</p>
            </div>
        </section>

        <section class="message-area">
            <img src="/figma/images.jpg" alt="Supti" class="small-avatar" />
            <article class="message-bubble">
                <p>I am inquiring about the current availability of stock for oranges?</p>
                <small>Sent by Marko43 Oct 2 at 4:32PM</small>
            </article>
        </section>
    </main>

    <footer class="composer-bar">
        <div class="composer-wrap">
            <label for="msgInput">Message</label>
            <div class="composer-row">
                <input id="msgInput" type="text" placeholder="Enter Message" />
                <button type="button">Send</button>
            </div>
        </div>
    </footer>
</body>

</html>
