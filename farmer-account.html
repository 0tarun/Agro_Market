<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Update - AgroMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="farmer-dashboard.css" />
    <link rel="stylesheet" href="farmer-account.css" />
</head>

<body>
    <main class="dashboard-page">
        <aside class="sidebar">
            <div>
                <div class="profile-block">
                    <img src="/figma/images (5).jpg" alt="Farmer profile" class="profile-image" />
                    <h2 class="profile-name">Abdul Baten Molla</h2>
                    <p class="profile-location">Kadirdi Bazar</p>
                </div>

                <nav class="menu" aria-label="Sidebar menu">
                    <a href="farmer-dashboard.html" class="menu-item">
                        <span class="menu-icon">&#9638;</span>
                        Overview
                    </a>
                    <a href="farmer-products.html" class="menu-item">
                        <span class="menu-icon">&#9635;</span>
                        Products
                    </a>
                    <a href="farmer-orders.html" class="menu-item">
                        <span class="menu-icon">&#9745;</span>
                        Orders
                    </a>
                    <a href="farmer-feedback.html" class="menu-item">
                        <span class="menu-icon">&#9993;</span>
                        Feedback
                    </a>
                    <a href="farmer-help-support.html" class="menu-item">
                        <span class="menu-icon">?</span>
                        Help &amp; Support
                    </a>
                    <a href="farmer-account.html" class="menu-item active">
                        <span class="menu-icon">&#9787;</span>
                        Account
                    </a>
                </nav>
            </div>

            <a href="index.html" class="logout-btn">Logout</a>
        </aside>

        <section class="main-panel account-main">
            <div class="account-head">
                <h1>Personal <span>Information</span></h1>
                <button type="button" class="edit-btn">Edit</button>
            </div>

            <form class="account-form" action="#" method="post" enctype="multipart/form-data">
                <div class="left-col">
                    <label>
                        Email Address
                        <input type="email" value="baten.farmer@gmail.com" />
                    </label>

                    <label>
                        Password
                        <input type="password" value="12345678" />
                    </label>

                    <label>
                        First Name
                        <input type="text" value="Abdul" />
                    </label>

                    <label>
                        Last Name
                        <input type="text" value="Baten Molla" />
                    </label>

                    <label>
                        Phone Number
                        <input type="tel" value="09123456789" />
                    </label>
                </div>

                <div class="right-col">
                    <label>
                        Location Address
                        <input type="text" value="Division" />
                    </label>

                    <label>
                        Division
                        <select>
                            <option>Dhaka</option>
                            <option>Chattogram</option>
                            <option>Rajshahi</option>
                        </select>
                    </label>

                    <label>
                        District
                        <select>
                            <option>Faridpur</option>
                            <option>Dhaka</option>
                            <option>Gazipur</option>
                        </select>
                    </label>

                    <label>
                        Street, Village, Thana, Union
                        <input type="text" value="Bohorampur Bridg, Suvarnapur, Kadirdi Thana, Kadirdi Bazar Union" />
                    </label>

                    <div class="upload-wrap">
                        <p>Profile Image</p>
                        <div class="upload-row">
                            <img src="/figma/images (5).jpg" alt="Current profile image" class="upload-preview" />
                            <label for="profileUpload" class="upload-btn">Upload New Image</label>
                            <input id="profileUpload" type="file" accept="image/*" />
                        </div>
                    </div>
                </div>

                <button type="submit" class="update-btn">Update</button>
            </form>
        </section>
    </main>
</body>

</html>
