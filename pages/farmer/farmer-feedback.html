<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/farmer-dashboard.css" />
    <link rel="stylesheet" href="../../assets/css/farmer-feedback.css" />
</head>

<body>
    <main class="dashboard-page">
        <aside class="sidebar">
            <div>
                <div class="profile-block">
                    <img id="sidebarProfileImage" src="../../figma/images (5).jpg" alt="Farmer profile"
                        class="profile-image" />
                    <h2 id="sidebarProfileName" class="profile-name">My Farmer Account</h2>
                    <p id="sidebarProfileLocation" class="profile-location">Loading...</p>
                </div>

                <nav class="menu" aria-label="Sidebar menu">
                    <a href="farmer-dashboard.html" class="menu-item">
                        <span class="menu-icon">&#9638;</span>
                        Overview
                    </a>
                    <a href="farmer-products.html" class="menu-item">
                        <span class="menu-icon">&#9635;</span>
                        Products
                    </a>
                    <a href="farmer-orders.html" class="menu-item">
                        <span class="menu-icon">&#9745;</span>
                        Orders
                    </a>
                    <a href="farmer-feedback.html" class="menu-item active">
                        <span class="menu-icon">&#9993;</span>
                        Feedback
                    </a>
                    <a href="farmer-help-support.html" class="menu-item">
                        <span class="menu-icon">?</span>
                        Help and Support
                    </a>
                    <a href="farmer-account.html" class="menu-item">
                        <span class="menu-icon">&#9787;</span>
                        Account
                    </a>
                </nav>
            </div>

            <a href="../../logout.php" class="logout-btn">Logout</a>
        </aside>

        <section class="main-panel feedback-main">
            <h1 class="feedback-title">Messages <span>from consumers</span></h1>

            <section id="feedbackList" class="feedback-list" aria-live="polite"></section>
            <p id="feedbackEmptyState" class="feedback-empty">No messages from customers yet.</p>
        </section>
    </main>
    <script src="../../assets/js/farmer-sidebar.js"></script>
    <script>
        (function setupFarmerFeedback() {
            var API_URL = '../../feedback-chat-data.php';
            var FALLBACK_AVATAR = '../../figma/images (2).jpg';
            var listEl = document.getElementById('feedbackList');
            var emptyEl = document.getElementById('feedbackEmptyState');

            function formatDate(raw) {
                if (!raw) {
                    return 'No messages yet';
                }

                var d = new Date(raw);
                if (Number.isNaN(d.getTime())) {
                    return raw;
                }

                return d.toLocaleString([], {
                    month: 'short',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit'
                });
            }

            function createThreadCard(item) {
                var card = document.createElement('article');
                card.className = 'feedback-card';

                var left = document.createElement('div');
                left.className = 'feedback-left';

                var avatar = document.createElement('img');
                avatar.className = 'feedback-avatar';
                avatar.src = item.participant_image || FALLBACK_AVATAR;
                avatar.alt = item.participant_name || 'Customer';
                avatar.onerror = function () { avatar.src = FALLBACK_AVATAR; };

                var body = document.createElement('div');

                var name = document.createElement('h3');
                name.textContent = item.participant_name || 'Customer';

                var lastMessage = document.createElement('p');
                lastMessage.textContent = item.last_message || 'No message yet';

                var meta = document.createElement('small');
                meta.textContent = (item.participant_location || 'Location not set') + ' • ' + formatDate(item.last_message_at);

                body.appendChild(name);
                body.appendChild(lastMessage);
                body.appendChild(meta);

                if (Number(item.unread_count || 0) > 0) {
                    var unread = document.createElement('span');
                    unread.className = 'unread-badge';
                    unread.textContent = String(item.unread_count);
                    body.appendChild(unread);
                }

                left.appendChild(avatar);
                left.appendChild(body);

                var replyLink = document.createElement('a');
                replyLink.className = 'reply-btn-alt';
                replyLink.textContent = 'Reply';
                replyLink.href = 'message-conversation.html?thread_id=' + encodeURIComponent(String(item.thread_id || 0));

                card.appendChild(left);
                card.appendChild(replyLink);
                return card;
            }

            function renderThreads(threads) {
                listEl.innerHTML = '';
                if (!Array.isArray(threads) || !threads.length) {
                    emptyEl.style.display = 'block';
                    return;
                }

                emptyEl.style.display = 'none';
                threads.forEach(function (item) {
                    listEl.appendChild(createThreadCard(item));
                });
            }

            function loadThreads() {
                fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        action: 'list_threads'
                    })
                })
                    .then(function (response) {
                        if (response.status === 401) {
                            window.location.href = '../auth/Login.html?error=Please+login+first';
                            return null;
                        }
                        return response.json();
                    })
                    .then(function (data) {
                        if (!data || !data.ok) {
                            renderThreads([]);
                            return;
                        }
                        renderThreads(Array.isArray(data.threads) ? data.threads : []);
                    })
                    .catch(function () {
                        renderThreads([]);
                    });
            }

            loadThreads();
            window.setInterval(loadThreads, 5000);
        })();
    </script>
</body>

</html>
